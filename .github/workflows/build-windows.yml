name: Windows build

on:
  push:
    branches: [main, Development]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the zip to a GitHub Release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,dev,build,streamdeck]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build OperatorBoard.exe
        run: python packaging/build.py --hidapi

      - uses: actions/upload-artifact@v4
        with:
          name: OperatorBoard-win64
          path: dist/OperatorBoard-*-win64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OperatorBoard-*-win64.zip
