name: Windows build

on:
  push:
    branches: [main, Development]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the zip to a GitHub Release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,dev,build,streamdeck]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build OperatorBoard.exe
        run: python packaging/build.py --hidapi

      - uses: actions/upload-artifact@v7
        with:
          name: OperatorBoard-win64
          path: dist/OperatorBoard-*-win64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OperatorBoard-*-win64.zip
          append_body: true
          body: |

            ---
            **Download** the `OperatorBoard-...-win64.zip` file below, unzip it and run `OperatorBoard.exe`. Python is not needed.

            [Code signing policy](https://github.com/JamesWardVP/Operator-Board#code-signing-policy) · [Privacy policy](https://github.com/JamesWardVP/Operator-Board#privacy-policy) · [License](https://github.com/JamesWardVP/Operator-Board/blob/main/LICENSE)
